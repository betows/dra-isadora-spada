        - heading "Harmonização facial, botox e mentoria em Blumenau" [level=2] [ref=f2e251]
        - paragraph [ref=f2e252]: Respostas diretas para quem pesquisa harmonização facial em Blumenau, botox, preenchimento e a Mentoria Ilumme. Avaliação presencial define indicação — nada aqui substitui consulta.
      - generic [ref=f2e253]:
        - generic [ref=f2e255]:
          - heading [level=3] [ref=f2e256]:
            - button "Onde fazer harmonização facial em Blumenau?" [expanded] [ref=f2e257]:
              - generic [aria-hidden] [ref=f2e259]: –
          - paragraph [ref=f2e262]: A Dra. Isadora Mór Spada (CRO-SC 18650) realiza harmonização facial em Blumenau, Santa Catarina. A avaliação é individual, com hora marcada pelo WhatsApp — o plano considera anatomia, queixa e o que faz sentido para o seu rosto, não um pacote genérico.
        - generic [ref=f2e264]:
          - heading [level=3] [ref=f2e265]:
            - button "A Dra. Isadora aplica botox em Blumenau?" [ref=f2e266]:
              - generic [aria-hidden] [ref=f2e268]: +
          - paragraph [ref=f2e269]: Sim. A toxina botulínica (botox) é um dos procedimentos da clínica, usada para suavizar rugas de expressão, equilibrar o terço superior e, quando indicado, sorriso gengival. Indicação, dose e pontos saem da avaliação presencial.
        - generic [ref=f2e271]:
          - heading [level=3] [ref=f2e272]:
            - button "Qual a diferença entre botox e preenchimento?" [ref=f2e273]:
              - generic [aria-hidden] [ref=f2e275]: +
          - paragraph [ref=f2e276]: O botox relaxa músculos responsáveis por rugas dinâmicas. O preenchimento com ácido hialurônico devolve ou redistribui volume (lábios, malar, mento, olheiras). Na harmonização facial em Blumenau, os dois podem se complementar — nunca de forma automática.
        - generic [ref=f2e278]:
          - heading [level=3] [ref=f2e279]:
            - button "O que é o Método LipSense®?" [ref=f2e280]:
              - generic [aria-hidden] [ref=f2e282]: +
          - paragraph [ref=f2e283]: "É o método criado pela Dra. Isadora para lábios com identidade: leitura de proporção, borda e movimento, para um resultado que conversa com o restante do rosto. Disponível no consultório e ensinado na Mentoria Ilumme."
        - generic [ref=f2e285]:
          - heading [level=3] [ref=f2e286]:
            - button "A Mentoria Ilumme é para pacientes ou para profissionais?" [ref=f2e287]:
              - generic [aria-hidden] [ref=f2e289]: +
          - paragraph [ref=f2e290]: A Mentoria Ilumme é voltada a profissionais da estética que querem técnica (incluindo LipSense® e SynFace), gestão e posicionamento. Pacientes de harmonização, botox e preenchimento são atendidos na clínica, em Blumenau.
        - generic [ref=f2e292]:
          - heading [level=3] [ref=f2e293]:
            - button "Quanto custa harmonização facial, botox ou preenchimento em Blumenau?" [ref=f2e294]:
              - generic [aria-hidden] [ref=f2e296]: +
          - paragraph [ref=f2e297]: Valores dependem do plano, da quantidade de produto e da indicação clínica. Não trabalhamos com tabela fechada sem avaliação. O caminho é uma conversa no WhatsApp e, se fizer sentido, uma consulta presencial.
        - generic [ref=f2e299]:
          - heading [level=3] [ref=f2e300]:
            - button "Harmonização facial dói? É segura?" [ref=f2e301]:
              - generic [aria-hidden] [ref=f2e303]: +
          - paragraph [ref=f2e304]: Conforto e segurança começam na avaliação, no material e na técnica. Pode haver desconforto pontual e inchaço esperado nos primeiros dias. Resultados variam; nenhum procedimento estético deve ser prometido como “definitivo” ou isento de risco. A Dra. Isadora explica indicações e cuidados antes de qualquer conduta.
        - generic [ref=f2e306]:
          - heading [level=3] [ref=f2e307]:
