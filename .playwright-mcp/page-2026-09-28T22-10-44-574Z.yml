        - paragraph [ref=f4e6]: Respostas diretas para quem pesquisa harmonização facial em Blumenau, botox, preenchimento e a Mentoria Ilumme. Avaliação presencial define indicação — nada aqui substitui consulta.
      - generic [ref=f4e7]:
        - generic [ref=f4e9]:
          - heading [level=3] [ref=f4e10]:
            - button "Onde fazer harmonização facial em Blumenau?" [expanded] [ref=f4e11]:
              - generic [aria-hidden] [ref=f4e13]: –
          - paragraph [ref=f4e16]: A Dra. Isadora Mór Spada (CRO-SC 18650) realiza harmonização facial em Blumenau, Santa Catarina. A avaliação é individual, com hora marcada pelo WhatsApp — o plano considera anatomia, queixa e o que faz sentido para o seu rosto, não um pacote genérico.
        - generic [ref=f4e18]:
          - heading [level=3] [ref=f4e19]:
            - button "A Dra. Isadora aplica botox em Blumenau?" [active] [ref=f4e20]:
              - generic [aria-hidden] [ref=f4e22]: +
          - paragraph [ref=f4e23]: Sim. A toxina botulínica (botox) é um dos procedimentos da clínica, usada para suavizar rugas de expressão, equilibrar o terço superior e, quando indicado, sorriso gengival. Indicação, dose e pontos saem da avaliação presencial.
        - generic [ref=f4e25]:
          - heading [level=3] [ref=f4e26]:
            - button "Qual a diferença entre botox e preenchimento?" [ref=f4e27]:
              - generic [aria-hidden] [ref=f4e29]: +
          - paragraph [ref=f4e30]: O botox relaxa músculos responsáveis por rugas dinâmicas. O preenchimento com ácido hialurônico devolve ou redistribui volume (lábios, malar, mento, olheiras). Na harmonização facial em Blumenau, os dois podem se complementar — nunca de forma automática.
        - generic [ref=f4e32]:
          - heading [level=3] [ref=f4e33]:
            - button "O que é o Método LipSense®?" [ref=f4e34]:
              - generic [aria-hidden] [ref=f4e36]: +
          - paragraph [ref=f4e37]: "É o método criado pela Dra. Isadora para lábios com identidade: leitura de proporção, borda e movimento, para um resultado que conversa com o restante do rosto. Disponível no consultório e ensinado na Mentoria Ilumme."
        - generic [ref=f4e39]:
          - heading [level=3] [ref=f4e40]:
            - button "A Mentoria Ilumme é para pacientes ou para profissionais?" [ref=f4e41]:
              - generic [aria-hidden] [ref=f4e43]: +
          - paragraph [ref=f4e44]: A Mentoria Ilumme é voltada a profissionais da estética que querem técnica (incluindo LipSense® e SynFace), gestão e posicionamento. Pacientes de harmonização, botox e preenchimento são atendidos na clínica, em Blumenau.
        - generic [ref=f4e46]:
          - heading [level=3] [ref=f4e47]:
            - button "Quanto custa harmonização facial, botox ou preenchimento em Blumenau?" [ref=f4e48]:
              - generic [aria-hidden] [ref=f4e50]: +
          - paragraph [ref=f4e51]: Valores dependem do plano, da quantidade de produto e da indicação clínica. Não trabalhamos com tabela fechada sem avaliação. O caminho é uma conversa no WhatsApp e, se fizer sentido, uma consulta presencial.
        - generic [ref=f4e53]:
          - heading [level=3] [ref=f4e54]:
            - button "Harmonização facial dói? É segura?" [ref=f4e55]:
              - generic [aria-hidden] [ref=f4e57]: +
          - paragraph [ref=f4e58]: Conforto e segurança começam na avaliação, no material e na técnica. Pode haver desconforto pontual e inchaço esperado nos primeiros dias. Resultados variam; nenhum procedimento estético deve ser prometido como “definitivo” ou isento de risco. A Dra. Isadora explica indicações e cuidados antes de qualquer conduta.
