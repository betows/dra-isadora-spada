        - generic [ref=f5e9]:
          - heading [level=3] [ref=f5e10]:
            - button "Onde fazer harmonização facial em Blumenau?" [expanded] [ref=f5e11]:
              - generic [aria-hidden] [ref=f5e13]: –
          - paragraph [ref=f5e16]: A Dra. Isadora Mór Spada (CRO-SC 18650) realiza harmonização facial em Blumenau, Santa Catarina. A avaliação é individual, com hora marcada pelo WhatsApp — o plano considera anatomia, queixa e o que faz sentido para o seu rosto, não um pacote genérico.
        - generic [ref=f5e18]:
          - heading [level=3] [ref=f5e19]:
            - button "A Dra. Isadora aplica botox em Blumenau?" [active] [ref=f5e20]:
              - generic [aria-hidden] [ref=f5e22]: +
          - paragraph [ref=f5e23]: Sim. A toxina botulínica (botox) é um dos procedimentos da clínica, usada para suavizar rugas de expressão, equilibrar o terço superior e, quando indicado, sorriso gengival. Indicação, dose e pontos saem da avaliação presencial.
        - generic [ref=f5e25]:
          - heading [level=3] [ref=f5e26]:
            - button "Qual a diferença entre botox e preenchimento?" [ref=f5e27]:
              - generic [aria-hidden] [ref=f5e29]: +
          - paragraph [ref=f5e30]: O botox relaxa músculos responsáveis por rugas dinâmicas. O preenchimento com ácido hialurônico devolve ou redistribui volume (lábios, malar, mento, olheiras). Na harmonização facial em Blumenau, os dois podem se complementar — nunca de forma automática.
        - generic [ref=f5e32]:
          - heading [level=3] [ref=f5e33]:
            - button "O que é o Método LipSense®?" [ref=f5e34]:
              - generic [aria-hidden] [ref=f5e36]: +
          - paragraph [ref=f5e37]: "É o método criado pela Dra. Isadora para lábios com identidade: leitura de proporção, borda e movimento, para um resultado que conversa com o restante do rosto. Disponível no consultório e ensinado na Mentoria Ilumme."
        - generic [ref=f5e39]:
          - heading [level=3] [ref=f5e40]:
            - button "A Mentoria Ilumme é para pacientes ou para profissionais?" [ref=f5e41]:
              - generic [aria-hidden] [ref=f5e43]: +
          - paragraph [ref=f5e44]: A Mentoria Ilumme é voltada a profissionais da estética que querem técnica (incluindo LipSense® e SynFace), gestão e posicionamento. Pacientes de harmonização, botox e preenchimento são atendidos na clínica, em Blumenau.
        - generic [ref=f5e46]:
          - heading [level=3] [ref=f5e47]:
            - button "Quanto custa harmonização facial, botox ou preenchimento em Blumenau?" [ref=f5e48]:
              - generic [aria-hidden] [ref=f5e50]: +
          - paragraph [ref=f5e51]: Valores dependem do plano, da quantidade de produto e da indicação clínica. Não trabalhamos com tabela fechada sem avaliação. O caminho é uma conversa no WhatsApp e, se fizer sentido, uma consulta presencial.
        - generic [ref=f5e53]:
