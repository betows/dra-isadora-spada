              - generic [aria-hidden] [ref=e259]: –
          - paragraph [ref=e262]: A Dra. Isadora Mór Spada (CRO-SC 18650) realiza harmonização facial em Blumenau, Santa Catarina. A avaliação é individual, com hora marcada pelo WhatsApp — o plano considera anatomia, queixa e o que faz sentido para o seu rosto, não um pacote genérico.
        - generic [ref=e264]:
          - heading [level=3] [ref=e265]:
            - button "A Dra. Isadora aplica botox em Blumenau?" [ref=e266]:
              - generic [aria-hidden] [ref=e268]: +
          - paragraph [ref=e269]: Sim. A toxina botulínica (botox) é um dos procedimentos da clínica, usada para suavizar rugas de expressão, equilibrar o terço superior e, quando indicado, sorriso gengival. Indicação, dose e pontos saem da avaliação presencial.
        - generic [ref=e271]:
          - heading [level=3] [ref=e272]:
            - button "Qual a diferença entre botox e preenchimento?" [ref=e273]:
              - generic [aria-hidden] [ref=e275]: +
          - paragraph [ref=e276]: O botox relaxa músculos responsáveis por rugas dinâmicas. O preenchimento com ácido hialurônico devolve ou redistribui volume (lábios, malar, mento, olheiras). Na harmonização facial em Blumenau, os dois podem se complementar — nunca de forma automática.
