              - generic [aria-hidden] [ref=e282]: +
          - paragraph [ref=e283]: "É o método criado pela Dra. Isadora para lábios com identidade: leitura de proporção, borda e movimento, para um resultado que conversa com o restante do rosto. Disponível no consultório e ensinado na Mentoria Ilumme."
        - generic [ref=e285]:
          - heading [level=3] [ref=e286]:
            - button "A Mentoria Ilumme é para pacientes ou para profissionais?" [ref=e287]:
              - generic [aria-hidden] [ref=e289]: +
          - paragraph [ref=e290]: A Mentoria Ilumme é voltada a profissionais da estética que querem técnica (incluindo LipSense® e SynFace), gestão e posicionamento. Pacientes de harmonização, botox e preenchimento são atendidos na clínica, em Blumenau.
