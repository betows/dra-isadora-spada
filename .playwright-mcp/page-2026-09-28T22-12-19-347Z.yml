        - paragraph [ref=f6e226]: Respostas diretas para quem pesquisa harmonização facial em Blumenau, botox, preenchimento e a Mentoria Ilumme. Avaliação presencial define indicação — nada aqui substitui consulta.
      - generic [ref=f6e227]:
        - generic [ref=f6e229]:
          - heading [level=3] [ref=f6e230]:
            - button "Onde fazer harmonização facial em Blumenau?" [expanded] [ref=f6e231]:
              - generic [aria-hidden] [ref=f6e233]: –
          - paragraph [ref=f6e236]: A Dra. Isadora Mór Spada (CRO-SC 18650) realiza harmonização facial em Blumenau, Santa Catarina. A avaliação é individual, com hora marcada pelo WhatsApp — o plano considera anatomia, queixa e o que faz sentido para o seu rosto, não um pacote genérico.
        - generic [ref=f6e238]:
          - heading [level=3] [ref=f6e239]:
            - button "A Dra. Isadora aplica botox em Blumenau?" [active] [ref=f6e240]:
              - generic [aria-hidden] [ref=f6e242]: +
          - paragraph [ref=f6e243]: Sim. A toxina botulínica (botox) é um dos procedimentos da clínica, usada para suavizar rugas de expressão, equilibrar o terço superior e, quando indicado, sorriso gengival. Indicação, dose e pontos saem da avaliação presencial.
        - generic [ref=f6e245]:
          - heading [level=3] [ref=f6e246]:
            - button "Qual a diferença entre botox e preenchimento?" [ref=f6e247]:
              - generic [aria-hidden] [ref=f6e249]: +
          - paragraph [ref=f6e250]: O botox relaxa músculos responsáveis por rugas dinâmicas. O preenchimento com ácido hialurônico devolve ou redistribui volume (lábios, malar, mento, olheiras). Na harmonização facial em Blumenau, os dois podem se complementar — nunca de forma automática.
        - generic [ref=f6e252]:
          - heading [level=3] [ref=f6e253]:
            - button "O que é o Método LipSense®?" [ref=f6e254]:
              - generic [aria-hidden] [ref=f6e256]: +
          - paragraph [ref=f6e257]: "É o método criado pela Dra. Isadora para lábios com identidade: leitura de proporção, borda e movimento, para um resultado que conversa com o restante do rosto. Disponível no consultório e ensinado na Mentoria Ilumme."
        - generic [ref=f6e259]:
          - heading [level=3] [ref=f6e260]:
            - button "A Mentoria Ilumme é para pacientes ou para profissionais?" [ref=f6e261]:
              - generic [aria-hidden] [ref=f6e263]: +
          - paragraph [ref=f6e264]: A Mentoria Ilumme é voltada a profissionais da estética que querem técnica (incluindo LipSense® e SynFace), gestão e posicionamento. Pacientes de harmonização, botox e preenchimento são atendidos na clínica, em Blumenau.
        - generic [ref=f6e266]:
          - heading [level=3] [ref=f6e267]:
            - button "Quanto custa harmonização facial, botox ou preenchimento em Blumenau?" [ref=f6e268]:
              - generic [aria-hidden] [ref=f6e270]: +
          - paragraph [ref=f6e271]: Valores dependem do plano, da quantidade de produto e da indicação clínica. Não trabalhamos com tabela fechada sem avaliação. O caminho é uma conversa no WhatsApp e, se fizer sentido, uma consulta presencial.
        - generic [ref=f6e273]:
          - heading [level=3] [ref=f6e274]:
            - button "Harmonização facial dói? É segura?" [ref=f6e275]:
              - generic [aria-hidden] [ref=f6e277]: +
          - paragraph [ref=f6e278]: Conforto e segurança começam na avaliação, no material e na técnica. Pode haver desconforto pontual e inchaço esperado nos primeiros dias. Resultados variam; nenhum procedimento estético deve ser prometido como “definitivo” ou isento de risco. A Dra. Isadora explica indicações e cuidados antes de qualquer conduta.
        - generic [ref=f6e280]:
